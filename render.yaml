services:
  - type: web
    name: operation-blackout
    runtime: node
    plan: free
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST_PIN
        value: "1337"
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
